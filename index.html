<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <!-- Security Headers -->
  <meta http-equiv="Content-Security-Policy" 
    content="
      default-src 'self';
      script-src 'self' 'unsafe-inline';
      style-src 'self' 'unsafe-inline';
      media-src 'self' blob:;
      connect-src 'self';
      worker-src 'self' blob:;
    " 
  />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="Referrer-Policy" content="no-referrer" />
  <meta http-equiv="Permissions-Policy" content="microphone=(self)" />

  <title>CRISPY BARNACLE</title>

  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: "Inter", "Segoe UI", sans-serif;
      color: #fff;
    }

    /* ── Main WebGPU canvas ── */
    #gpu-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 0;
    }

    /* ── UI layer sits above the canvas ── */
    #ui-root {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
      pointer-events: none;
    }

    /* ── WebGPU not supported screen ── */
    #no-webgpu {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 999;
      background: #000;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
      padding: 40px;
    }

    #no-webgpu h1 {
      font-size: 28px;
      font-weight: 300;
      letter-spacing: 4px;
      color: #ff4444;
    }

    #no-webgpu p {
      font-size: 14px;
      line-height: 1.8;
      opacity: 0.7;
      max-width: 480px;
    }

    #no-webgpu a {
      color: #88aaff;
      text-decoration: none;
    }

    /* ── Loading screen ── */
    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      transition: opacity 0.8s ease;
    }

    #loading-screen h1 {
      font-size: 36px;
      font-weight: 100;
      letter-spacing: 12px;
      text-transform: uppercase;
      color: #fff;
    }

    #loading-bar-wrap {
      width: 280px;
      height: 1px;
      background: rgba(255,255,255,0.1);
    }

    #loading-bar {
      height: 1px;
      width: 0%;
      background: linear-gradient(90deg, #4488ff, #aa66ff);
      transition: width 0.3s ease;
    }

    #loading-label {
      font-size: 11px;
      letter-spacing: 3px;
      opacity: 0.4;
      text-transform: uppercase;
    }
  </style>
</head>

<body>

  <!-- WebGPU not supported fallback -->
  <div id="no-webgpu">
    <h1>WEBGPU NOT SUPPORTED</h1>
    <p>
      Crispy Barnacle requires WebGPU to run.<br/>
      Please use the latest version of 
      <a href="https://www.google.com/chrome/" target="_blank">Google Chrome</a> or 
      <a href="https://www.microsoft.com/edge" target="_blank">Microsoft Edge</a>.
    </p>
  </div>

  <!-- Loading screen -->
  <div id="loading-screen">
    <h1>CRISPY BARNACLE</h1>
    <div id="loading-bar-wrap">
      <div id="loading-bar"></div>
    </div>
    <div id="loading-label">INITIALIZING</div>
  </div>

  <!-- WebGPU canvas -->
  <canvas id="gpu-canvas"></canvas>

  <!-- UI layer -->
  <div id="ui-root"></div>

  <!-- Entry point -->
  <script type="module" src="src/main.js"></script>

</body>
</html>
